<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="container">

      <nav class="site-nav" aria-label="Site">
        <a class="site-title" href="{{ site.baseurl }}/">{{ site.title }}</a>
        <div class="nav-links">
          <a href="{{ site.baseurl }}/about">About</a>
          <a href="{{ site.baseurl }}/atom.xml">Feed</a>
          <button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          </button>
        </div>
      </nav>

      <main id="main">
        {{ content }}
      </main>

      <footer class="site-footer">
        &copy; {{ site.time | date: '%Y' }} {{ site.author.name }}
        &middot; <a href="{{ site.author.url }}">@nishzsche</a>
        &middot; <a href="{{ site.baseurl }}/atom.xml">Feed</a>
      </footer>

    </div>

    <script>
    // Wide tables scroll sideways in their own box instead of widening the page. A box that
    // actually scrolls gets a tab stop and a label, so keyboard and screen reader users can use it.
    (function () {
      var boxes = [];
      var tables = document.querySelectorAll('.post-content table, .page table');
      Array.prototype.forEach.call(tables, function (table) {
        var box = document.createElement('div');
        box.className = 'table-scroll';
        table.parentNode.insertBefore(box, table);
        box.appendChild(table);
        boxes.push(box);
      });

      function label() {
        boxes.forEach(function (box) {
          if (box.scrollWidth > box.clientWidth + 1) {
            box.setAttribute('tabindex', '0');
            box.setAttribute('role', 'region');
            box.setAttribute('aria-label', 'Table, scrolls sideways');
          } else {
            box.removeAttribute('tabindex');
            box.removeAttribute('role');
            box.removeAttribute('aria-label');
          }
        });
      }

      if (boxes.length) {
        label();
        window.addEventListener('resize', label);
      }
    })();
    </script>

    <script>
    // Light/dark toggle. The starting theme is set in head.html; a click saves the choice.
    // Until the reader picks one, the page follows the system setting, even if it changes.
    (function () {
      var root = document.documentElement;
      var button = document.querySelector('.theme-toggle');
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      var giscusReady = false;

      function saved() {
        try { return localStorage.getItem('theme'); } catch (e) { return null; }
      }

      // Giscus comments live in an iframe, so they get the theme by message
      function syncGiscus() {
        var frame = document.querySelector('iframe.giscus-frame');
        if (!frame) return;
        var theme = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        frame.contentWindow.postMessage({ giscus: { setConfig: { theme: theme } } }, 'https://giscus.app');
      }

      // Charts follow the theme. chart.html's dark <source> starts out following the system
      // setting; from here on it follows the page's theme instead.
      function swapCharts(theme) {
        var media = theme === 'dark' ? 'all' : 'not all';
        var sources = document.querySelectorAll('source[data-chart-dark]');
        Array.prototype.forEach.call(sources, function (source) {
          if (source.getAttribute('media') !== media) source.setAttribute('media', media);
        });

        // Older markup: data-dark-src on a Markdown image
        var imgs = document.querySelectorAll('img[data-dark-src]');
        Array.prototype.forEach.call(imgs, function (img) {
          if (!img.hasAttribute('data-light-src')) img.setAttribute('data-light-src', img.getAttribute('src'));
          var src = img.getAttribute(theme === 'dark' ? 'data-dark-src' : 'data-light-src');
          if (img.getAttribute('src') !== src) img.setAttribute('src', src);
          img.setAttribute('data-theme-ready', '');
        });
      }

      // The browser's toolbar colour (phones) follows the page
      var themeColor = document.querySelector('meta[name="theme-color"]');

      function apply(theme) {
        swapCharts(theme);
        root.setAttribute('data-theme', theme);
        var label = 'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode';
        button.setAttribute('aria-label', label);
        button.title = label;
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#171614' : '#faf8f3');
        syncGiscus();
      }

      // Print is always on paper colours (see main.css), so print the light charts
      window.addEventListener('beforeprint', function () { swapCharts('light'); });
      window.addEventListener('afterprint', function () {
        swapCharts(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
      });

      apply(root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');

      button.addEventListener('click', function () {
        var theme = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', theme); } catch (e) {}
        apply(theme);
      });

      if (media.addEventListener) {
        media.addEventListener('change', function (e) {
          if (!saved()) apply(e.matches ? 'dark' : 'light');
        });
      }

      // Giscus loads lazily: once it first reports in, make sure it has the current theme
      window.addEventListener('message', function (e) {
        if (giscusReady || e.origin !== 'https://giscus.app' || !e.data || !e.data.giscus) return;
        giscusReady = true;
        syncGiscus();
      });
    })();
    </script>

    {% if page.math %}
    <!-- Math rendering, only on pages with `math: true`: elsewhere a dollar sign in prose stays a dollar sign -->
    <script type="text/x-mathjax-config">
      MathJax.Hub.Config({
        tex2jax: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          processEscapes: true
        }
      });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.0/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>
    {% endif %}

  </body>
</html>
