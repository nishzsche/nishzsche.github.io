# Setup
title:               Learning curve
tagline:             'Testing what I think I know'
# Used in link previews and search results: keep it under 160 characters, plain text
description:         'A learning journal: ML, OMSCS and whatever currently has my attention. Feynman-ish: if I cannot explain it clearly, I probably do not understand it yet.'
url:                 https://nishzsche.github.io
baseurl:             ''
paginate:            5
permalink:           pretty
# Post dates are written in IST. Without this, GitHub Pages builds in UTC, and a post dated
# before 05:30 IST gets the previous day's date and URL.
timezone:            Asia/Kolkata

# About/contact
author:
  name:              Nishanth Rajamani
  url:               https://x.com/nishzsche
  linkedin:          https://www.linkedin.com/in/nishanthrajamani   # the follow line under each post

# Gems: GitHub Pages runs only the plugins listed here, whatever the Gemfile says
plugins:
  - jekyll-paginate
  - jekyll-sitemap   # sitemap.xml and robots.txt

# Not published. GitHub Pages turns Markdown without front matter into pages, so repo docs go here.
# Listing anything replaces Jekyll's default list, so Gemfile and vendor are repeated.
exclude:
  - README.md
  - CLAUDE.md
  - TODO.md
  - WRITING.md
  - notebooks/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/

# Link previews: fallback image for pages without their own `image:` (1200x630, made by
# scripts/site_card.py), with its description for screen readers
og_image: /public/site-card.png
og_image_alt: "Learning curve: Testing what I think I know. Experiments on AI models, with real data and my guesses written down first. Beside it, a sketch of a park held up in the park."

# Analytics: set one to switch it on (empty = off)
goatcounter_code:    nishzsche   # https://nishzsche.goatcounter.com
google_analytics_id: # e.g. G-XXXXXXXXXX

# Comments (Giscus): stored as GitHub Discussions in this blog's repo, one discussion per page
# path. Values from https://giscus.app; the giscus app must be installed on the repo.
giscus:
  repo:              nishzsche/nishzsche.github.io
  repo_id:           R_kgDOIpfVpg
  category:          Announcements
  category_id:       DIC_kwDOIpfVps4DLzJ9

# Custom vars
version:             1.1.0
